<div
  class="select-wrapper"
  [class.select-block]="fullWidth">

  <select

    class="select"

    [ngClass]="[
      'select-' + size
    ]"

    [disabled]="disabled"

    [value]="value"

    (change)="onChange($event)">

    <option value="">
      {{ placeholder }}
    </option>

    <option
      *ngFor="let item of options"
      [value]="item.value">

      {{ item.label }}

    </option>

  </select>

</div>
