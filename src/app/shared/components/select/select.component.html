<div
  class="select-wrapper"
  [class.select-block]="fullWidth">

  <select
    class="select"
    [ngClass]="['select-' + size]"
    [disabled]="disabled"
    [(ngModel)]="internalValue"
    (ngModelChange)="onModelChange($event)">

    <option value="">
      {{ placeholder }}
    </option>

    <option
      *ngFor="let item of options"
      [value]="item.value">
      {{ item.label }}
    </option>

  </select>

</div>
