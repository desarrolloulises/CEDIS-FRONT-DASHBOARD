<button
  class="btn"
  [ngClass]="[
    'btn-' + type,
    'btn-' + size,
    fullWidth ? 'btn-block' : ''
  ]"
  [style.background-color]="backgroundColor"
  [style.color]="textColor"
  [disabled]="disabled"
  (click)="onClick($event)"
>
  <i *ngIf="icon" [class]="icon"></i>

  <span>{{ label }}</span>
</button>
