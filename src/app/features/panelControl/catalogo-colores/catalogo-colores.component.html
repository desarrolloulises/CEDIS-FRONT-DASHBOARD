<app-loading-spinner [visible]="cargando()" [overlay]="true" texto="Cargando catálogo..."></app-loading-spinner>

<section class="ev-wrapper">

  <!-- ── Agregar ──────────────────────────────────────────────────────────── -->
  <div class="ev-header">
    <input id="nuevo-color" class="agregar__input-color" type="color" [ngModel]="nuevoColor()"
      (ngModelChange)="nuevoColor.set($event)" />
    <span class="agregar__hex">{{ nuevoColor() }}</span>
    <app-button type="primary" , label="Agregar" , size="sm" , (clicked)="agregarColor()" [disabled]="guardandoNuevo()">
    </app-button>
  </div>

  <!-- ── Tabla ─────────────────────────────────────────────────────────────── -->
  <div class="wrapper">

    <table class="table" *ngIf="colores().length > 0 || !cargando()">
      <thead>
        <tr>
          <th>#</th>
          <th>Color</th>
          <th>Hex</th>
          <th>Disponible</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="colores().length === 0 && !cargando()">
          <td class="empty" colspan="4">
            No hay colores en el catálogo. Agrega el primero.
          </td>
        </tr>

        <tr *ngFor="let item of colores(); let i = index" [class.fila-inactiva]="item.lblBandera === '0'"
          (dblclick)="abrirPaleta(item, colorPicker)">
          <td>{{ item.lblIdColor }}</td>

          <td>
            <!-- Swatch visible; input oculto activado desde el componente -->
            <span class="color-swatch" [style.background]="item.lblColor" title="Doble clic para editar"></span>
            <input #colorPicker type="color" [value]="item.lblColor" class="color-picker-hidden"
              (change)="guardarColorDirecto(item, colorPicker.value)" />
          </td>

          <td><code>{{ item.lblColor }}</code></td>

          <td>
            <label class="checkbox-wrap" (click)="$event.stopPropagation()">
              <input type="checkbox" [checked]="item.lblBandera === '1'" (change)="toggleBandera(item)" />
            </label>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</section>

<!-- ── Toast ───────────────────────────────────────────────────────────────── -->
<app-toast *ngIf="toast().visible" [tipo]="toast().tipo" [titulo]="toast().titulo" [mensaje]="toast().mensaje"
  (cerrar)="cerrarToast()"></app-toast>
