<section class="glass-card">
    <div class="form-container-perfil">
        <h3   >Información del Usuario</h3>

        <div class="form-grid">
            <div class="form-row">
                <label class="label-mini">Clave de usuario</label>
                <input type="text" class="input-filter-notable" placeholder="Ej. USR-001">
            </div>

            <div class="form-row">
                <label class="label-mini">Nombre</label>
                <input type="text" class="input-filter-notable" placeholder="Nombre completo">
            </div>

            <div class="form-row">
                <label class="label-mini">Puesto</label>
                <input type="text" class="input-filter-notable" placeholder="Cargo actual">
            </div>

            <div class="form-row">
                <label class="label-mini">Estatus</label>
                <select class="input-filter-notable">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="form-row">
                <label class="label-mini">Perfil</label>
                <input type="text" class="input-filter-notable" placeholder="Nivel de acceso">
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-action-real blue">Guardar Cambios</button>
        </div>
    </div>
</section>
