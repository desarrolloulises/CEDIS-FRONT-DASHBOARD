<section class="home-container">
  <!-- Fondo con elementos gráficos animados-->
  <div class="background-decorations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="home-card">
    <div class="home-content-layout">
      <!-- Columna principal: Título, Subtítulo y Fecha -->
      <div class="home-header">
        <div class="date-badge">
          <span class="pulse-dot"></span>
          <span class="date-text">{{ currentDate }}</span>
        </div>

        <h1 class="title">
          Bienvenido al sistema <span class="highlight-primary">WMS</span> del CEDIS de Milano
        </h1>
        <p class="subtitle">
          Esperamos que estes teniendo un buen día :D
        </p>
      </div>

      <!-- Área de animación-->
      <div class="hero-graphic-corner">
        <div class="abstract-hero-graphic">
          <div class="geometric-shape shape-back"></div>
          <div class="geometric-shape shape-middle"></div>
          <div class="geometric-shape shape-front">
            <div class="radar-wave"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
