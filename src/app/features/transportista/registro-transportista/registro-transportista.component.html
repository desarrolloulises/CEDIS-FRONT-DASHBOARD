<div class="dashboard-wrapper">
    <section class="glass-card">
        <!-- Fila Superior: Título y Botones con tus clases originales -->
        <header class="header-main-row section-compact"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

            <div class="glass-card" style="padding: 10px 30px; border: 2px solid #000;">
                <h1 style="margin: 0; font-size: 24px; color: #000;">Registro de Transportistas</h1>
            </div>

            <div class="main-actions-group" style="display: flex; gap: 10px;">
                <button class="btn-action-real gray" (click)="agregarCita()">Agregar cita</button>
                <button class="btn-action-real gray">Registro por</button>
                <button class="btn-consultar" (click)="consultar()" [disabled]="isWaiting()">
                    {{ isWaiting() ? 'Cargando...' : 'Consultar' }}
                </button>
            </div>
        </header>

        <!-- Fila Media: Filtro Estilo Notable -->
        <section class="filter-row section-compact" style="margin-bottom: 20px;">
            <div class="field-inline">
                <label class="label-formal label-spacing">Filtro</label>
                <input #filtroInput id="filtro-pie" type="text" placeholder="Buscar en resultados...">
            </div>
        </section>
    </section>

    <!-- Tabla Estilo Approved con Cabecera Oscura -->
    <div class="tabla-scroll-container">
        <section class="table-frame">
            <table class="table-approved">
                <thead>
                    <tr>
                        <th style="width: 50px;"></th> <!-- Icono edición -->
                        <th>Tipo</th>
                        <th>Fecha</th>
                        <th>Empresa</th>
                        <th>Operador</th>
                        <th>CURP</th>
                        <th>Placas</th>
                        <th class="text-center">Entrada</th>
                        <th class="text-center">Salida</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let fila of tablaDatos()">
                        <td class="text-center">
                            <span style="cursor: pointer;">📝</span>
                        </td>
                        <td>{{ fila.tipo }}</td>
                        <td>{{ fila.fecha }}</td>
                        <td>{{ fila.empresa }}</td>
                        <td>{{ fila.operador }}</td>
                        <td>{{ fila.curp }}</td>
                        <td>{{ fila.placas }}</td>
                        <td class="text-center link-detail" (click)="verIngreso(fila)">{{ fila.entrada }}</td>
                        <td class="text-center link-detail" (click)="verSalida(fila)">{{ fila.salida }}</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

</div>
