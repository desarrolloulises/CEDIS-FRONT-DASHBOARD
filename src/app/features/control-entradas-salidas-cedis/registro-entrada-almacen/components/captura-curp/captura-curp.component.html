<div class="tarjeta">
    <div class="encabezado">
        <h2>Registro de ingreso al almaén</h2>
    </div>

    <div class="campo-curp">
        <label for="curp-label">CURP</label>
        <div class="curp-input-group">
            <app-curp-input class="campo-curp"
                [value]=" curp" placeholder="CURP"
                (valueChange)="onCurpChange($event)" (enter)=" validarCurp()">
            </app-curp-input>

            <app-button label="Buscar" type="primary" size="md" [disabled]="!curpCompleto" (clicked)="validarCurp()">
            </app-button>
        </div>
    </div>
</div>
