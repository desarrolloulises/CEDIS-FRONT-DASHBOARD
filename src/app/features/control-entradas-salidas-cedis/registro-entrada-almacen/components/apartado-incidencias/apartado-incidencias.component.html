<div class="apartado-incidencias">
  <div *ngIf="!curp" class="aviso">
    Captura el CURP en el apartado de Captura para consultar las incidencias.
  </div>

  <div class="seccion-header">
    <h4>Incidencias</h4>
  </div>

  <ng-container *ngIf="curp">
    <!-- Formulario para agregar una nueva incidencia -->
    <div class="incidencia-form">
      <div class="incidencia-form-nivel">
        <app-select [options]="nivelOptions" placeholder="Nivel" [value]="nuevaIncidencia.nivel"
          (valueChange)="onNivelChange($event)">
        </app-select>
      </div>

      <div class="incidencia-form-descripcion">
        <app-input placeholder="Describe la incidencia..." [value]="nuevaIncidencia.descripcion"
          (valueChange)="onDescripcionChange($event)" (enter)="crearIncidenciaEvent()">
        </app-input>
      </div>

      <app-button icon="ti ti-plus" label="" type="primary" size="md" title="Agregar incidencia"
        (clicked)="crearIncidenciaEvent()">
      </app-button>
    </div>

    <div *ngIf="incidenciasCargadas && incidencias.length === 0" class="aviso">
      No se encontraron incidencias para este CURP.
    </div>

    <!-- Tabla de incidencias -->
    <div class="tabla-wrapper" *ngIf="incidencias.length">
      <table class="tabla-registros">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Nivel</th>
            <th>Descripción</th>
            <th class="col-accion">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of incidencias">
            <td>{{ formatearFecha(item.lblFecha) }}</td>
            <td>
              <span class="nivel-badge" [style.background-color]="item.lblColor.trim()">
                {{ item.lblDescripcionNivel }}
              </span>
            </td>
            <td>{{ item.lblDescripcion }}</td>
            <td class="col-accion">
              <app-icon-button icon="ti ti-pencil" type="secondary" size="sm" title="Editar"
                (click)="editarIncidenciaEvent(item)">
              </app-icon-button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>
</div>
