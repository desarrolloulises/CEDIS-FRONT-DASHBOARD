<div class="registro-entrada-almacen">
  <!-- Toast: instancia única para todo el componente -->
  <app-toast *ngIf="toast.visible" [tipo]="toast.tipo" [titulo]="toast.titulo" [mensaje]="toast.mensaje"
    (cerrar)="cerrarToast()">
  </app-toast>

  <!-- Loading Spinner: instancia única para todo el componente -->
  <app-loading-spinner [visible]="cargando" [overlay]="true">
  </app-loading-spinner>

  <!-- Barra superior: navegación + reset general -->
  <div class="barra-superior" *ngIf="curpValidado">
    <div class="botones-nav">
      <!-- Botón de Datos -->
      <app-button [label]="apartados[0].titulo" [type]="apartadoActivo === 'datos' ? 'primary' : 'ghost'" size="sm"
        (clicked)="seleccionarApartado('datos')">
      </app-button>

      <!-- Botón de Vehículo -->
      <app-button [label]="apartados[1].titulo" [type]="apartadoActivo === 'vehiculo' ? 'primary' : 'ghost'" size="sm"
        (clicked)="seleccionarApartado('vehiculo')">
      </app-button>

      <!-- Botón de Validaciones -->
      <app-button [label]="apartados[2].titulo" [type]="apartadoActivo === 'validaciones' ? 'primary' : 'ghost'"
        size="sm" (clicked)="seleccionarApartado('validaciones')">
      </app-button>

      <!-- Botón de Incidencias con color dinámico usando helper -->
      <app-button [label]="apartados[3].titulo" [type]="apartadoActivo === 'incidencias' ? 'primary' : 'ghost'"
        size="sm" [textColor]="getColorBotonIncidencias()"
        (clicked)="seleccionarApartado('incidencias')">
      </app-button>
 
      <!-- Botón de Otros -->
      <app-button [label]="apartados[4].titulo" [type]="apartadoActivo === 'otros' ? 'primary' : 'ghost'" size="sm"
        (clicked)="seleccionarApartado('otros')">
      </app-button>
    </div>

    <app-button label="Nueva consulta" type="secondary" size="sm" (clicked)="resetFormulario()">
    </app-button>
  </div>

  <!-- Contenido según el apartado seleccionado -->
  <div class="contenido-wrapper">
    <div class="contenido" [ngSwitch]="apartadoActivo">
      <!-- Apartado 1: Captura de CURP (solo al inicio o al reiniciar) -->
      <app-captura-curp *ngSwitchCase="'curp'" [curp]="datosForm.curp" (curpChange)="onCurpChange($event)"
        (curpValidar)="onCurpValidar()">
      </app-captura-curp>

      <!-- Apartado 2: Datos -->
      <app-apartado-datos *ngSwitchCase="'datos'" [datosForm]="datosForm" [motivoOptions]="motivoOptions"
        [areaOptions]="areaOptions" [opcionMotivoSeleccionado]="opcionMotivoSeleccionado" [imagenUrl]="imagenUrl"
        [imagenExiste]="imagenExiste" [vetoExistente]="vetoExistente" [editandoVeto]="editandoVeto"
        [tipoVetoOptions]="tipoVetoOptions" [nuevoVeto]="nuevoVeto" [vetoConsultado]="vetoConsultado"
        [tipoVetoSeleccionadoEsDefinitivo]="tipoVetoSeleccionadoEsDefinitivo"
        (datosFormChange)="onDatosFormChange($event)" (onCurpBlur)="onCurpBlur()"
        (verImagenAmpliada)="verImagenAmpliada()" (abrirCapturaImagen)="abrirCapturaImagen($event)"
        (eliminarImagen)="eliminarImagen()" (onSeleccionarImagen)="onSeleccionarImagen($event)"
        (iniciarEdicionVeto)="iniciarEdicionVeto()" (cancelarEdicionVeto)="cancelarEdicionVeto()"
        (onTipoVetoChange)="onTipoVetoChange($event)" (aplicarVeto)="aplicarVeto()"
        (actualizarVisitante)="actualizarVisitante()">
      </app-apartado-datos>

      <!-- Apartado 3: Vehículo -->
      <app-apartado-vehiculo *ngSwitchCase="'vehiculo'" [curp]="datosForm.curp" [vehiculoForm]="vehiculoForm"
        [tipoUnidadOptions]="tipoUnidadOptions" (vehiculoFormChange)="onVehiculoFormChange($event)"
        (actualizarVisitante)="actualizarVisitante()">
      </app-apartado-vehiculo>

      <!-- Apartado 4: Validaciones -->
      <app-apartado-validaciones *ngSwitchCase="'validaciones'" [curp]="datosForm.curp" [validaciones]="validaciones"
        [validacionesCargadas]="validacionesCargadas" (toggleValidacion)="toggleValidacion($event)">
      </app-apartado-validaciones>

      <!-- Apartado 5: Incidencias -->
      <app-apartado-incidencias *ngSwitchCase="'incidencias'" [curp]="datosForm.curp" [nivelOptions]="nivelOptions"
        [nuevaIncidencia]="nuevaIncidencia" [incidencias]="incidencias" [incidenciasCargadas]="incidenciasCargadas"
        (crearIncidencia)="crearIncidencia()" (abrirEdicionIncidencia)="abrirEdicionIncidencia($event)">
      </app-apartado-incidencias>

      <!-- Apartado 6: Otros -->
      <app-apartado-otros *ngSwitchCase="'otros'" [curp]="datosForm.curp" [nuevoElemento]="nuevoElemento"
        [elementosAdicionales]="elementosAdicionales" [elementosAdicionalesCargados]="elementosAdicionalesCargados"
        (crearElementoAdicional)="crearElementoAdicional()" (abrirEdicionElemento)="abrirEdicionElemento($event)">
      </app-apartado-otros>
    </div>
  </div>

  <!-- Modal para editar una incidencia -->
  <app-modal [visible]="modalEdicionIncidenciaVisible" title="Editar incidencia" width="480px"
    (close)="cerrarEdicionIncidencia()">
    <div class="modal-edicion-incidencia">
      <div class="campo-select">
        <label class="campo-label">Nivel</label>
        <app-select [options]="nivelOptions" placeholder="Seleccione un nivel" [value]="edicionIncidenciaForm.nivel"
          (valueChange)="edicionIncidenciaForm.nivel = $event">
        </app-select>
      </div>
      <app-input label="Descripción" [value]="edicionIncidenciaForm.descripcion"
        (valueChange)="edicionIncidenciaForm.descripcion = $event">
      </app-input>
      <div class="modal-edicion-acciones">
        <app-button label="Cancelar" type="ghost" size="sm" (clicked)="cerrarEdicionIncidencia()">
        </app-button>
        <app-button label="Guardar" type="primary" size="sm" (clicked)="guardarEdicionIncidencia()">
        </app-button>
      </div>
    </div>
  </app-modal>

  <!-- Modal para editar un elemento adicional (Otros) -->
  <app-modal [visible]="modalEdicionElementoVisible" title="Editar elemento" width="480px"
    (close)="cerrarEdicionElemento()">
    <div class="modal-edicion-incidencia">
      <app-input label="Clasificación" [value]="edicionElementoForm.tipoElemento"
        (valueChange)="edicionElementoForm.tipoElemento = $event">
      </app-input>
      <app-input label="Descripción" [value]="edicionElementoForm.descripcionElemento"
        (valueChange)="edicionElementoForm.descripcionElemento = $event">
      </app-input>
      <app-input label="Cantidad" type="number" [value]="edicionElementoForm.cantidad"
        (valueChange)="edicionElementoForm.cantidad = $event">
      </app-input>
      <div class="modal-edicion-acciones">
        <app-button label="Cancelar" type="ghost" size="sm" (clicked)="cerrarEdicionElemento()">
        </app-button>
        <app-button label="Guardar" type="primary" size="sm" (clicked)="guardarEdicionElemento()">
        </app-button>
      </div>
    </div>
  </app-modal>

  <!-- Modal de imagen ampliada -->
  <div *ngIf="imagenAmpliada" class="imagen-modal" (click)="cerrarImagenAmpliada()">
    <img [src]="imagenUrl" alt="Imagen">
  </div>
</div>
