<div class="login-screen">
  <div class="login-card">
    <img src="logo.png" alt="Logo" class="login-logo">
    <h2>Sistema de Almacén CEDIS</h2>
    
    <form>
      <div class="input-group">
        <label>Usuario</label>
        <input type="text" placeholder="Ej: Milano">
      </div>
      
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••••••••••">
      </div>
      
      <button type="button" class="btn-login" (click)="entrar()">
        Ingresar
      </button>
    </form>
  </div>
</div>
