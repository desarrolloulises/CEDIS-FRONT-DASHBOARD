<header class="header-superior">

  <!-- Izquierda: hamburguesa -->
  <div class="header-izquierda">
    <button
      class="btn-hamburguesa"
      (click)="onToggle()"
      [class.activo]="sidebarAbierto"
      [attr.aria-label]="sidebarAbierto ? 'Cerrar menú' : 'Abrir menú'"
    >
      <span class="linea"></span>
      <span class="linea"></span>
      <span class="linea"></span>
    </button>
  </div>

  <!-- Derecha: usuario -->
  <div class="header-derecha">

    <button
      class="user-btn"
      (click)="toggleMenuUsuario()"
      [attr.aria-expanded]="menuUsuarioAbierto()"
      aria-haspopup="true"
    >
      <div class="user-avatar">M</div>
      <div class="user-info">
        <span class="user-name">Milano</span>
        <span class="user-role">Admin CEDIS</span>
      </div>
      <i class="ti ti-chevron-down user-chevron" [class.rotado]="menuUsuarioAbierto()" aria-hidden="true"></i>
    </button>

    @if (menuUsuarioAbierto()) {
      <div class="user-dropdown" role="menu">
        <button class="dropdown-item" (click)="irACambiarPass()" role="menuitem">
          <i class="ti ti-key" aria-hidden="true"></i>
          Cambiar contraseña
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item dropdown-item--danger" (click)="logout()" role="menuitem">
          <i class="ti ti-logout" aria-hidden="true"></i>
          Cerrar sesión
        </button>
      </div>
    }

  </div>
</header>
